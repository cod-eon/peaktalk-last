# =============================================================================
# PeakTalk — Production Docker Compose
# =============================================================================
# Usage:
#   First deploy  : ./deploy.sh
#   Redeploy      : ./deploy.sh
#   View logs     : docker compose logs -f api
#   Stop all      : docker compose down
#   Stop + wipe DB: docker compose down -v   ← WARNING: deletes all data!
# =============================================================================

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Production database. Data is stored in a named Docker volume (postgres_data)
  # so it survives container restarts and re-deploys.
  postgres:
    <<: *default-logging
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peaktalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-peaktalk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peaktalk} -d ${POSTGRES_DB:-peaktalk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s

  # ── Redis ───────────────────────────────────────────────────────────────────
  # Used by Celery as task broker and result backend.
  redis:
    <<: *default-logging
    image: redis:7.4.10-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Alembic migrations (one-shot) ───────────────────────────────────────────
  # Runs database migrations once and exits. Declared as a separate service so
  # CI/CD can run it before bringing up the API.
  # Uses the same image as `api` — no separate build needed.
  migrate:
    <<: *default-logging
    image: peaktalk-backend:${IMAGE_TAG:-latest}
    env_file: ./backend/.env
    environment:
      # Override DATABASE_URL so it points at the Docker postgres service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peaktalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peaktalk}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,redis,api,frontend"
      no_proxy: "localhost,127.0.0.1,postgres,redis,api,frontend"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: peaktalk-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Docker-internal DB + Redis URLs (override the localhost values in .env)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peaktalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peaktalk}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,redis,api,frontend"
      no_proxy: "localhost,127.0.0.1,postgres,redis,api,frontend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery worker ────────────────────────────────────────────────────────────
  # Processes background tasks (document parsing, etc.)
  worker:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: peaktalk-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peaktalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peaktalk}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,redis,api,frontend"
      no_proxy: "localhost,127.0.0.1,postgres,redis,api,frontend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Celery Beat scheduler ────────────────────────────────────────────────────
  # Sends periodic tasks (e.g. expire abandoned sessions every 30 min).
  beat:
    <<: *default-logging
    image: peaktalk-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peaktalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peaktalk}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,redis,api,frontend"
      no_proxy: "localhost,127.0.0.1,postgres,redis,api,frontend"
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  # Built as a standalone Next.js app (output: standalone in next.config.ts).
  # The build reads NEXT_PUBLIC_* vars at build time — they are baked into the
  # JS bundle. Make sure frontend/.env.local has the correct production values
  # BEFORE running docker compose build frontend.
  frontend:
    <<: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${NEXT_PUBLIC_HCAPTCHA_SITEKEY:-placeholder_sitekey}
    image: peaktalk-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - internal
    depends_on:
      - api

  # ── Nginx reverse proxy + SSL termination ───────────────────────────────────
  # Handles HTTPS (Let's Encrypt certs via Certbot), rate limiting,
  # and routes traffic to the correct upstream service.
  nginx:
    <<: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certificates managed by Certbot on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot challenge directory
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - internal
      - logto-internal
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

# ── Named volumes ──────────────────────────────────────────────────────────────
# These persist across container restarts and re-deploys.
volumes:
  postgres_data:    # PostgreSQL data — never delete this in production!
  redis_data:       # Redis data
  certbot_webroot:  # Certbot ACME challenge files

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  logto-internal:
    external: true
    name: peaktalk-logto_logto-internal
