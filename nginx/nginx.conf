# =============================================================================
# PeakTalk — Nginx Configuration
# =============================================================================
# Responsibilities:
#   - Redirect all HTTP → HTTPS
#   - Terminate TLS (Let's Encrypt / Certbot)
#   - Rate-limit API and upload endpoints
#   - Proxy /api/* → FastAPI (api:8000 on Docker internal network)
#   - Proxy everything else → Next.js (frontend:3000 on Docker internal network)
#   - Certbot ACME challenge (/.well-known/acme-challenge/)
#
# Before first run:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. peaktalk.io)
#   2. Get a certificate: see DEPLOY.md → "Step 4: SSL Certificate"
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Max upload size (slightly above the 50 MB API limit)
    client_max_body_size 55m;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # General API: 30 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # Upload endpoint: stricter — 10 uploads per minute per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # ── Upstream definitions ───────────────────────────────────────────────────
    # These names match the service names in docker-compose.yml.
    # Docker's internal DNS resolves "api" and "frontend" automatically.
    upstream fastapi_backend {
        server api:8000;
        keepalive 32;
    }

    upstream nextjs_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        # Allow Certbot ACME challenge through HTTP (required to get/renew certs)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        # ── SSL certificates (issued by Certbot) ──────────────────────────────
        # These files are created by: certbot certonly --webroot -d YOUR_DOMAIN
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # ── TLS settings ──────────────────────────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Upload endpoint (stricter rate limit, large body allowed) ──────────
        # Must be defined BEFORE the general /api/ block
        location /api/documents/upload {
            limit_req zone=upload burst=3 nodelay;

            # Strip /api prefix before forwarding to FastAPI
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            client_max_body_size 55m;
        }

        # ── General API ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── Next.js frontend ───────────────────────────────────────────────────
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # Required for Next.js HMR websockets (not used in production,
            # but harmless to keep)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Health check endpoint (no rate limit, used by CI/CD) ──────────────
        location = /health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Swagger/OpenAPI is disabled in production (APP_ENV=production)
        # so no need to block /docs here.
    }
}
