# =============================================================================
# PeakTalk — Nginx Configuration
# =============================================================================
# Responsibilities:
#   - Redirect all HTTP → HTTPS
#   - Terminate TLS (Let's Encrypt / Certbot)
#   - Rate-limit API and upload endpoints
#   - Proxy /api/* → FastAPI (api:8000 on Docker internal network)
#   - Proxy everything else → Next.js (frontend:3000 on Docker internal network)
#   - Certbot ACME challenge (/.well-known/acme-challenge/)
#
# Before first run:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. peaktalk.io)
#   2. Get a certificate: see DEPLOY.md → "Step 4: SSL Certificate"
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Max upload size (slightly above the 50 MB API limit)
    client_max_body_size 55m;

    # Docker internal DNS — resolves service names after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # General API: 60 req/min per IP (frontend makes 5-6 parallel requests on load)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Upload endpoint: stricter — 10 uploads per minute per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # NOTE: No upstream blocks here intentionally.
    # Using variable-based proxy_pass forces nginx to use the resolver (127.0.0.11)
    # on every request, so container restarts don't produce 502 errors.
    # Static upstream blocks resolve hostnames once at startup and cache the IP forever.

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name peaktalk.ru www.peaktalk.ru;

        # Allow Certbot ACME challenge through HTTP (required to get/renew certs)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name peaktalk.ru www.peaktalk.ru;

        # ── SSL certificates (issued by Certbot) ──────────────────────────────
        # These files are created by: certbot certonly --webroot -d peaktalk.ru
        ssl_certificate     /etc/letsencrypt/live/peaktalk.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/peaktalk.ru/privkey.pem;

        # ── TLS settings ──────────────────────────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Upload endpoint (stricter rate limit, large body allowed) ──────────
        # Must be defined BEFORE the general /api/ block
        location /api/documents/upload {
            limit_req zone=upload burst=3 nodelay;

            # Variable-based proxy_pass forces nginx to re-resolve "api" via
            # Docker DNS (127.0.0.11) on every request instead of caching the IP
            # at startup — prevents 502 after container restarts.
            set $upstream_api http://api:8000;

            # Strip /api prefix before forwarding to FastAPI
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            client_max_body_size 55m;
        }

        # ── General API ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            set $upstream_api http://api:8000;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── Next.js frontend ───────────────────────────────────────────────────
        location / {
            set $upstream_frontend http://frontend:3000;

            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # Required for Next.js HMR websockets (not used in production,
            # but harmless to keep)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Increase buffer sizes for large Supabase JWT Set-Cookie headers
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ── Health check endpoint (no rate limit, used by CI/CD) ──────────────
        location = /health {
            set $upstream_api http://api:8000;
            # No path in proxy_pass — nginx appends the request URI (/health) automatically
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # Swagger/OpenAPI is disabled in production (APP_ENV=production)
        # so no need to block /docs here.
    }
}
