# =============================================================================
# PeakTalk — CI/CD Pipeline
# =============================================================================
# Triggered automatically on every push to the `main` branch.
#
# What this does:
#   1. Run backend tests (pytest with SQLite in-memory — no real DB needed)
#   2. SSH into the VDS
#   3. Pull latest code
#   4. Build Docker images
#   5. Run Alembic migrations
#   6. Restart services
#   7. Verify the API is healthy
#
# Required GitHub Secrets (set in: GitHub repo → Settings → Secrets → Actions):
#   VDS_HOST        — IP address or hostname of your VDS (e.g. 123.45.67.89)
#   VDS_USER        — SSH username (e.g. root or ubuntu)
#   VDS_SSH_KEY     — Private SSH key (contents of ~/.ssh/id_ed25519)
#   VDS_APP_DIR     — Path to the app on the VDS (e.g. /opt/peaktalk)
#   VDS_DOMAIN      — PeakTalk production domain (e.g. peaktalk.ru)
#
# Optional secrets:
#   SLACK_WEBHOOK   — Slack webhook URL for deploy notifications
# =============================================================================

name: Deploy to VDS

on:
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - 'tests/**'
              - 'nginx/**'
              - 'docker-compose.yml'
              - 'deploy.sh'
              - '.github/workflows/deploy.yml'

  # ── Job 1: Run Tests ────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Note: aiosqlite is included in requirements.txt for CI tests

      - name: Run pytest
        working-directory: backend
        env:
          # Tests use SQLite in-memory — no real credentials needed
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_KEY: "test-service-role-key"
          GEMINI_API_KEY: "test-gemini-key"
          REDIS_URL: "redis://localhost:6379/0"
          APP_ENV: "test"
        run: |
          pytest tests/ -v --tb=short

  # ── Job 2: Frontend Checks ──────────────────────────────────────────────────
  frontend-checks:
    name: Frontend Changed-File Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi

            echo "Transient npm failure detected. Cleaning cache and retrying..."
            npm cache verify || true
            sleep 15
          done

      - name: Detect changed frontend source files
        id: changed-frontend
        uses: tj-actions/changed-files@v45
        with:
          files: |
            frontend/src/**/*.ts
            frontend/src/**/*.tsx
            frontend/src/**/*.js
            frontend/src/**/*.jsx
            frontend/src/**/*.mjs
            frontend/src/**/*.cjs

      - name: Lint changed frontend files
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          echo "Linting changed files:"
          printf '%s\n' "${{ steps.changed-frontend.outputs.all_changed_files }}"
          npx eslint ${{ steps.changed-frontend.outputs.all_changed_files }}

      - name: Skip when no lintable frontend files changed
        if: steps.changed-frontend.outputs.any_changed != 'true'
        run: echo "No frontend source file changes detected. Skipping frontend lint."

  # ── Job 3: Deploy ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: [changes, test, frontend-checks]
    if: >
      always() &&
      needs.changes.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.deploy == 'true'
      ) &&
      (
        needs.test.result == 'success' ||
        needs.test.result == 'skipped'
      ) &&
      (
        needs.frontend-checks.result == 'success' ||
        needs.frontend-checks.result == 'skipped'
      )

    steps:
      # Install the SSH key from GitHub Secrets so we can connect to the VDS
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_KEY }}

      # Add the VDS host to known_hosts so SSH doesn't ask for confirmation
      - name: Add VDS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VDS_HOST }}" >> ~/.ssh/known_hosts

      # SSH into the VDS and run the deploy script.
      # VDS uses SSH deploy key (~/.ssh/id_ed25519) to pull from GitHub —
      # no GITHUB_TOKEN manipulation needed.
      - name: Deploy
        run: |
          ssh ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
            "cd ${{ secrets.VDS_APP_DIR }} && bash deploy.sh"

      # Quick sanity check: hit the health endpoint from GitHub's runner
      # (optional — only works if your VDS is publicly accessible)
      - name: Verify deployment
        run: |
          if [ -n "${{ secrets.VDS_DOMAIN }}" ]; then
            for i in $(seq 1 10); do
              if curl -ksf "https://${{ secrets.VDS_DOMAIN }}/health"; then
                exit 0
              fi
              echo "Health check retry $i/10..."
              sleep 3
            done
            echo "Health check failed."
            exit 1
          else
            echo "Health check skipped: VDS_DOMAIN secret is not set."
          fi

      # Uncomment to get Slack notifications on deploy
      # - name: Notify Slack
      #   if: always()
      #   uses: slackapi/slack-github-action@v1.26.0
      #   with:
      #     payload: |
      #       {
      #         "text": "${{ job.status == 'success' && '✅' || '❌' }} Deploy to PeakTalk VDS: ${{ job.status }}\nCommit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.actor }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
