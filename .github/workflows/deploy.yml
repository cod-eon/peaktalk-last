name: PeakTalk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peaktalk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_KEY: test-key
      SUPABASE_SERVICE_KEY: test-service-key
      GEMINI_API_KEY: test-gemini-key
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_URL: https://example.invalid/api
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: test-site-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to VDS
    needs: [backend-tests, frontend-quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_USER: ${{ secrets.VDS_USER }}
      VDS_APP_DIR: ${{ secrets.VDS_APP_DIR }}
      VDS_DOMAIN: ${{ secrets.VDS_DOMAIN }}
      VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in VDS_HOST VDS_USER VDS_APP_DIR VDS_DOMAIN VDS_KNOWN_HOSTS VDS_SSH_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required deployment secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_KEY }}

      - name: Install pinned VDS host key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VDS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync repository to VDS
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backend/.env' \
            --exclude='frontend/.env.local' \
            --exclude='node_modules' \
            --exclude='frontend/.next' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10' \
            ./ "${VDS_USER}@${VDS_HOST}:${VDS_APP_DIR}/"

      - name: Run server-side deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "${VDS_USER}@${VDS_HOST}" \
            "cd '${VDS_APP_DIR}' && DEPLOY_SHA='${GITHUB_SHA}' DEPLOY_HEALTH_HOST='${VDS_DOMAIN}' bash deploy.sh"

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "https://${VDS_DOMAIN}/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed" >&2
          exit 1
