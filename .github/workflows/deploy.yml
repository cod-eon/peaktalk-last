name: PeakTalk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peaktalk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  harness:
    name: Harness and repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .harness/package-lock.json
      - name: Install harness dependencies
        working-directory: .harness
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run harness tests
        run: npm test --prefix .harness
      - name: Validate five project skills
        shell: bash
        run: |
          set -euo pipefail
          skills=(controlled-development deploy-safety product-copy product-decision ui-quality)
          for skill in "${skills[@]}"; do
            test -s ".agents/skills/${skill}/SKILL.md"
            test -s ".agents/skills/${skill}/agents/openai.yaml"
          done
      - name: Check diff formatting
        run: git diff --check

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  frontend-quality:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: https://example.invalid/api
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: test-site-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit high and critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend lockfile for audit
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Validate backend dependency resolution
        run: python -m pip check

  compose-validation:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        run: |
          cp backend/.env.example backend/.env
          POSTGRES_PASSWORD=ci-placeholder docker compose config --quiet
      - name: Validate deployment shell syntax
        run: bash -n deploy.sh

  build-artifact:
    name: Build immutable release artifact
    needs: [harness, backend-tests, frontend-quality, dependency-audit, compose-validation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITEKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend build configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in NEXT_PUBLIC_API_URL NEXT_PUBLIC_HCAPTCHA_SITEKEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required build secret: ${variable}" >&2
              exit 1
            fi
          done
      - name: Build pinned application images
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "peaktalk-backend:${GITHUB_SHA}" backend
          docker build --pull -t "peaktalk-worker:${GITHUB_SHA}" -f backend/Dockerfile.worker backend
          docker build --pull \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-arg "NEXT_PUBLIC_HCAPTCHA_SITEKEY=${NEXT_PUBLIC_HCAPTCHA_SITEKEY}" \
            -t "peaktalk-frontend:${GITHUB_SHA}" frontend
      - name: Assemble and checksum release artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/peaktalk-release"
          mkdir -p "$release_dir"
          api_id="$(docker image inspect "peaktalk-backend:${GITHUB_SHA}" --format '{{.Id}}')"
          worker_id="$(docker image inspect "peaktalk-worker:${GITHUB_SHA}" --format '{{.Id}}')"
          frontend_id="$(docker image inspect "peaktalk-frontend:${GITHUB_SHA}" --format '{{.Id}}')"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'api_tag=peaktalk-backend:%s\n' "$GITHUB_SHA"
            printf 'api_id=%s\n' "$api_id"
            printf 'worker_tag=peaktalk-worker:%s\n' "$GITHUB_SHA"
            printf 'worker_id=%s\n' "$worker_id"
            printf 'frontend_tag=peaktalk-frontend:%s\n' "$GITHUB_SHA"
            printf 'frontend_id=%s\n' "$frontend_id"
          } > "$release_dir/release-manifest"
          docker save \
            "peaktalk-backend:${GITHUB_SHA}" \
            "peaktalk-worker:${GITHUB_SHA}" \
            "peaktalk-frontend:${GITHUB_SHA}" \
            | gzip -1 > "$release_dir/images.tar.gz"
          (cd "$release_dir" && sha256sum images.tar.gz > images.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: peaktalk-release-${{ github.sha }}
          path: ${{ runner.temp }}/peaktalk-release
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy verified artifact to VDS
    needs: [build-artifact]
    if: >-
      needs.build-artifact.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_USER: ${{ secrets.VDS_USER }}
      VDS_APP_DIR: ${{ secrets.VDS_APP_DIR }}
      VDS_DOMAIN: ${{ secrets.VDS_DOMAIN }}
      VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      LOGTO_APP_ID: ${{ secrets.LOGTO_APP_ID }}
      LOGTO_APP_SECRET: ${{ secrets.LOGTO_APP_SECRET }}
      LOGTO_COOKIE_SECRET: ${{ secrets.LOGTO_COOKIE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: peaktalk-release-${{ github.sha }}
          path: .release
      - name: Normalize release artifact layout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .release/images.tar.gz && -f .release/images.sha256 && -f .release/release-manifest ]]; then
            exit 0
          fi

          archive_path="$(find .release -type f -name images.tar.gz -print -quit)"
          [[ -n "$archive_path" ]] || { echo "Release image archive is missing" >&2; exit 1; }
          artifact_dir="$(dirname "$archive_path")"
          for required_file in images.tar.gz images.sha256 release-manifest; do
            test -f "$artifact_dir/$required_file" || {
              echo "Release artifact file is missing: $required_file" >&2
              exit 1
            }
            cp "$artifact_dir/$required_file" ".release/$required_file"
          done
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/images.tar.gz
          test -f .release/images.sha256
          test -f .release/release-manifest
          for variable in VDS_HOST VDS_USER VDS_APP_DIR VDS_DOMAIN VDS_KNOWN_HOSTS VDS_SSH_KEY LOGTO_APP_ID LOGTO_APP_SECRET LOGTO_COOKIE_SECRET; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required deployment secret: ${variable}" >&2
              exit 1
            fi
          done
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_KEY }}
      - name: Install pinned VDS host key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VDS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Sync verified source and artifact
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backend/.env' \
            --exclude='frontend/.env.local' \
            --exclude='.release' \
            --exclude='ВРЕМЕННО_key' \
            --exclude='*.key' \
            --exclude='node_modules' \
            --exclude='frontend/.next' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10' \
            ./ "${VDS_USER}@${VDS_HOST}:${VDS_APP_DIR}/"
          rsync -az --delete \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10' \
            .release/ "${VDS_USER}@${VDS_HOST}:${VDS_APP_DIR}/.release/"
      - name: Run server-side deployment
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT
          chmod 600 "$runtime_env"
          printf 'LOGTO_ENDPOINT=https://auth.peaktalk.ru\n' > "$runtime_env"
          printf 'LOGTO_APP_ID=%s\n' "$LOGTO_APP_ID" >> "$runtime_env"
          printf 'LOGTO_APP_SECRET=%s\n' "$LOGTO_APP_SECRET" >> "$runtime_env"
          printf 'LOGTO_COOKIE_SECRET=%s\n' "$LOGTO_COOKIE_SECRET" >> "$runtime_env"
          printf 'LOGTO_API_RESOURCE=https://peaktalk.ru/api\n' >> "$runtime_env"
          printf 'APP_BASE_URL=https://peaktalk.ru\n' >> "$runtime_env"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$runtime_env" "${VDS_USER}@${VDS_HOST}:/tmp/peaktalk-frontend-env"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "${VDS_USER}@${VDS_HOST}" \
            "sudo install -o peaktalk-agent -g docker -m 600 /tmp/peaktalk-frontend-env '${VDS_APP_DIR}/frontend/.env.local' && rm -f /tmp/peaktalk-frontend-env"
      - name: Activate Logto and Yandex runtime providers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "${VDS_USER}@${VDS_HOST}" "sudo python3 - '${VDS_APP_DIR}/backend/.env'" <<'PY'
          import os
          import pathlib
          import sys
          import tempfile

          path = pathlib.Path(sys.argv[1])
          values = {
              "AUTH_PROVIDER": "logto",
              "LOGTO_AUDIENCE": "https://peaktalk.ru/api",
              "STORAGE_PROVIDER": "yandex",
          }
          existing = path.read_text().splitlines()
          seen = set()
          output = []
          for line in existing:
              key = line.split("=", 1)[0] if "=" in line else ""
              if key in values:
                  output.append(f"{key}={values[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          output.extend(f"{key}={value}" for key, value in values.items() if key not in seen)
          fd, temporary = tempfile.mkstemp(prefix=".peaktalk-env.", dir=path.parent)
          try:
              with os.fdopen(fd, "w") as handle:
                  handle.write("\n".join(output) + "\n")
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "${VDS_USER}@${VDS_HOST}" \
            "cd '${VDS_APP_DIR}' && DEPLOY_SHA='${GITHUB_SHA}' DEPLOY_HEALTH_HOST='${VDS_DOMAIN}' ARTIFACT_DIR='${VDS_APP_DIR}/.release' bash deploy.sh"
      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "https://${VDS_DOMAIN}/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed" >&2
          exit 1
